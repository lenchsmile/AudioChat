application:
  name: AudioChat
  version: 0.5.0
network:
  local_ip: 127.0.0.1
  local_port: 10088
  remote_ip: 127.0.0.1
  remote_port: 10086
  enable_heartbeat: true
  heartbeat_interval_ms: 1000
audio:
  sample_rate: 48000
  frame_duration_ms: 10
  input_device: auto
  output_device: auto
  volume: 1.0
codec:
  bitrate: 24000
  complexity: 3
  enable_fec: true
  enable_dtx: true
  enable_vbr: true
aec:
  enable: true
  filter_length_ms: 128
  suppression_level: 1
network_reliability:
  enable_monitoring: true
  enable_congestion_control: true
  enable_nack: true
  congestion_loss_threshold: 10.0
  congestion_rtt_threshold: 200.0
jitter_buffer:
  min_packets: 1
  max_packets: 3
  adaptive: true
presets:
  default: low-latency
